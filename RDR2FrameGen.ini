; RDR2FrameGen - DLSS Frame Generation for Red Dead Redemption 2 (Vulkan, RTX 40/50).
; Edit with the game closed.
[FrameGen]
; 1 = mod active, 0 = the game is left untouched.
Enabled=1
; Key that turns frame generation on/off in game. 0x24 = Home.
ToggleKey=0x24
; Camera clip planes handed to frame generation, in metres. The game does not report them;
; change only if objects close to the camera ghost.
CameraNear=0.15
CameraFar=10000
; How many game ticks behind the newest camera reading frames stay (0-3). Change only for testing.
CameraDelay=1
; 1 = frame generation gets the picture without HUD, so the minimap and prompts do not smear.
; 0 only to compare.
HudLess=1
; 1 = detailed diagnostics in RDR2FrameGen.log. Keep 0 for normal play.
DebugLogging=0
